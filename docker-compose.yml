services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: tech_share_api
    working_dir: /rails
    command: bash -lc "(bundle check || bundle install) && bundle exec rails server -b 0.0.0.0 -p 3001"
    ports:
      - "3001:3001"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_WITHOUT: ""
      BUNDLE_DEPLOYMENT: "0"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: tech_share_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech_share_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tech_share_development" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  bundle_cache:
