---
openapi: 3.0.3
info:
  title: TechShare API
  version: v1
  description: TechShare のバックエンド API v1
servers:
- url: http://localhost:3001
  description: local (docker)
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: Title can't be blank
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/Error"
    Tag:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: rails
        created_at:
          type: string
          format: date-time
    Post:
      type: object
      required:
      - id
      - user_id
      - title
      - body
      - created_at
      - tags
      - like_count
      - liked_by_current_user
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/Tag"
        like_count:
          type: integer
        liked_by_current_user:
          type: boolean
    PostWithComments:
      allOf:
      - "$ref": "#/components/schemas/Post"
      - type: object
        required:
        - comments
        properties:
          comments:
            type: array
            items:
              "$ref": "#/components/schemas/Comment"
    Comment:
      type: object
      required:
      - id
      - user_id
      - body
      - created_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
    CreatePostRequest:
      type: object
      required:
      - post
      properties:
        post:
          type: object
          required:
          - title
          - body
          properties:
            title:
              type: string
              example: Rails API
            body:
              type: string
              example: Post body
            tag_names:
              type: array
              items:
                type: string
              example:
              - rails
              - api
    UpdatePostRequest:
      type: object
      required:
      - post
      properties:
        post:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
            tag_names:
              type: array
              items:
                type: string
paths:
  "/api/v1/posts":
    get:
      summary: 記事一覧を取得する
      tags:
      - Posts
      parameters:
      - name: tag
        in: query
        required: false
        schema:
          type: string
        description: タグ名で記事を絞り込む (部分一致ではなく完全一致)
      responses:
        '200':
          description: タグ絞り込み成功
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - posts
                    properties:
                      posts:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Post"
    post:
      summary: 記事を作成する (要ログイン)
      tags:
      - Posts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - post
                    properties:
                      post:
                        "$ref": "#/components/schemas/Post"
        '422':
          description: バリデーションエラー (title が空)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: 未ログイン
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePostRequest"
        required: true
  "/api/v1/posts/{id}":
    get:
      summary: 記事詳細を取得する
      tags:
      - Posts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: 記事 ID
      responses:
        '200':
          description: 取得成功 (コメント一覧を含む)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - post
                    properties:
                      post:
                        "$ref": "#/components/schemas/PostWithComments"
        '404':
          description: 記事が存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/tags":
    get:
      summary: タグ一覧を取得する
      tags:
      - Tags
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - tags
                    properties:
                      tags:
                        type: array
                        items:
                          "$ref": "#/components/schemas/Tag"
